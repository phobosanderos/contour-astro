name: Verify social preview image

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-og.py'
      - 'public/fonts/geist-mono-latin.woff2'
      - 'public/img/favicon-light.svg'
      - 'public/img/og-home-v2.png'
      - 'src/pages/index.astro'
      - 'src/layouts/Base.astro'
      - '.github/workflows/refresh-og.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generation dependencies
        run: python -m pip install Pillow fonttools brotli cairosvg
      - name: Regenerate and verify social card
        run: |
          python scripts/generate-og.py
          git diff --exit-code -- public/img/og-home-v2.png src/pages/index.astro src/layouts/Base.astro
          test -s public/img/og-home-v2.png
