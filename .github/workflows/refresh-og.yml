name: Refresh social preview image

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-og.py'
      - 'public/fonts/geist-mono-latin.woff2'
      - 'public/img/favicon-light.svg'
      - '.github/workflows/refresh-og.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generation dependencies
        run: python -m pip install Pillow fonttools brotli cairosvg
      - name: Render social card
        run: python scripts/generate-og.py
      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/og-home-v2.png src/pages/index.astro src/layouts/Base.astro
          if ! git diff --cached --quiet; then
            git commit -m "Generate updated Geist Mono Open Graph image"
            git push
          fi
