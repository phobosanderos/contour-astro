name: Verify social preview image

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-og-image.mjs'
      - 'public/img/og-home-v4.svg'
      - 'public/img/og-home-v4.png'
      - 'src/pages/index.astro'
      - 'src/layouts/Base.astro'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-og.yml'
  pull_request:
    paths:
      - 'scripts/generate-og-image.mjs'
      - 'public/img/og-home-v4.svg'
      - 'public/img/og-home-v4.png'
      - 'src/pages/index.astro'
      - 'src/layouts/Base.astro'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-og.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Regenerate and verify social card
        run: |
          node scripts/generate-og-image.mjs
          git diff --exit-code -- public/img/og-home-v4.png
          test -s public/img/og-home-v4.png
