name: Generate archive video posters
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-archive-posters.mjs"
      - ".github/workflows/generate-archive-posters.yml"
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible WebP posters
        run: npm run posters
      - name: Commit posters and their source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/archive.json scripts/archive-poster-report.json public/img/work/archive/posters/
          if ! git diff --cached --quiet; then
            git commit -m "Generate archive video poster frames and timestamps"
            git push
          fi
